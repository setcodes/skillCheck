name: Validate Questions

on:
  pull_request:
    paths:
      - 'src/shared/questions/**'
      - 'src/shared/cases/**'
      - 'src/shared/quiz/**'
      - 'src/shared/bank/*schema.ts'
      - 'scripts/validate-questions.ts'
      - '.github/workflows/validate-questions.yml'

jobs:
  validate-questions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Та же проверка схемы, id и алиасов, что и в `npm run check`; падает при ошибках
      - name: Validate banks
        run: npm run validate-questions

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Банки — массивы; старый формат { questions: [...] } тоже поддерживаем
            const count = (file) => {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              const list = Array.isArray(data) ? data : data.questions ?? [];
              return { total: list.length, noFull: list.filter((q) => q.answer && !q.answer.full).length };
            };

            const lines = [];
            let total = 0;
            for (const dir of ['src/shared/questions', 'src/shared/cases', 'src/shared/quiz']) {
              if (!fs.existsSync(dir)) continue;
              for (const file of fs.readdirSync(dir).filter((f) => f.endsWith('.json'))) {
                const { total: n, noFull } = count(path.join(dir, file));
                total += n;
                lines.push(`- \`${dir}/${file}\`: ${n}${noFull ? ` (без развёрнутого ответа: ${noFull})` : ''}`);
              }
            }

            const marker = '<!-- question-validation-report -->';
            const body = [
              marker,
              '## 📊 Проверка банков',
              '',
              '✅ `npm run validate-questions` пройдена.',
              '',
              ...lines,
              `- **Всего элементов:** ${total}`,
            ].join('\n');

            // Обновляем прежний отчёт, а не добавляем новый на каждый пуш
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
