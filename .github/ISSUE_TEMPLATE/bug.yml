name: Ошибка
description: Что-то работает не так на сайте или в коде
title: "Ошибка: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Ошибка в ответе на вопрос — удобнее через форму «Предложить вопрос» (тип «Исправление»).
        Уязвимость — не сюда, а [приватно](https://github.com/setcodes/skillCheck/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы делали, что ожидали и что произошло на самом деле.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: |
        1. Открыть раздел «Задачи»
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия
      description: Из футера сайта, например v1.0.0 · 8e4eff3.
  - type: input
    id: env
    attributes:
      label: Браузер и устройство
      placeholder: Chrome 140, macOS
  - type: textarea
    id: extra
    attributes:
      label: Скриншоты и ошибки из консоли
      description: Необязательно.
