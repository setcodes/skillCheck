# Nginx внутри контейнера skillcheck-web: статика SPA. TLS и HSTS — на внешнем reverse proxy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Monaco грузится с cdn.jsdelivr.net и создаёт воркеры из blob:, шрифты — Google Fonts.
    # 'unsafe-eval' нужен только песочнице раннера (new Function) — см. location ниже.
    set $csp "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Воркер-песочница исполняет код кандидата через new Function — eval разрешён только ему.
    location ~ ^/assets/sandbox\.worker-[^/]+\.js$ {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Хешированные ассеты Vite — кэш на год.
    location /assets/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: любые маршруты отдают index.html, его не кэшируем — новая версия видна сразу.
    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
